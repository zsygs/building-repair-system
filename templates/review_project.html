<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审核项目 - 建筑修缮审批系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <div class="w-100 d-flex align-items-center">
                <div class="flex-grow-1">
                    <ul class="navbar-nav d-flex align-items-center">
                        <li class="nav-item">
                            <span class="nav-link" id="currentDate"></span>
                        </li>
                    </ul>
                </div>
                <div class="mx-auto">
                    <a class="navbar-brand text-center" href="{{ url_for('dashboard') }}">
                        <div class="d-flex align-items-center justify-content-center">
                            <i class="fas fa-building me-2"></i>
                            <span class="fs-4 fw-bold">建筑修缮审批系统</span>
                        </div>
                    </a>
                </div>
                <div class="flex-grow-1 text-end">
                    <ul class="navbar-nav d-flex align-items-center justify-content-end">
                        <li class="nav-item me-3">
                            <span class="nav-link">欢迎，{{ current_user.username }} ({{ current_user.role }})</span>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-secondary" href="{{ url_for('logout') }}">
                                <i class="fas fa-sign-out-alt me-1"></i> 退出登录
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', options);
        });
    </script>
    
    <div class="container mt-5 flex-grow-1">
        <div class="row">
            <div class="col-md-8">
                <h2>审核项目</h2>
                <div class="card fade-in">
                    <div class="card-header">
                        <h3>{{ project.name }}</h3>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <strong>位置：</strong>{{ project.location }}
                        </div>
                        <div class="mb-3">
                            <strong>预算：</strong>¥{{ project.budget }}
                        </div>
                        <div class="mb-3">
                            <strong>修缮内容：</strong>
                            <p>{{ project.content }}</p>
                        </div>
                        <div class="mb-3 user-info">
                            <i class="fas fa-user"></i>
                            <strong>申请人：</strong>{{ submitter.username }}
                        </div>
                    </div>
                </div>
                
                <div class="mt-4 fade-in">
                    <h3>审核意见</h3>
                    <form method="POST" action="{{ url_for('review_project', project_id=project.id) }}" class="form-container">
                        <div class="mb-3">
                            <label class="form-label">审核结果</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="status" id="approve" value="通过" checked>
                                <label class="form-check-label" for="approve">通过</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="status" id="reject" value="拒绝">
                                <label class="form-check-label" for="reject">拒绝</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="comment" class="form-label">审核意见</label>
                            <textarea class="form-control" id="comment" name="comment" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-check-circle"></i> 提交审核
                        </button>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
                            <i class="fas fa-times-circle"></i> 取消
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="mt-auto py-3 bg-light">
        <div class="container text-center">
            <span class="text-muted">© 2026 建筑修缮审批系统</span>
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
