<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建项目 - 建筑修缮审批系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <div class="w-100 d-flex align-items-center">
                <div class="flex-grow-1">
                    <ul class="navbar-nav d-flex align-items-center">
                        <li class="nav-item">
                            <span class="nav-link" id="currentDate"></span>
                        </li>
                    </ul>
                </div>
                <div class="mx-auto">
                    <a class="navbar-brand text-center" href="{{ url_for('dashboard') }}">
                        <div class="d-flex align-items-center justify-content-center">
                            <i class="fas fa-building me-2"></i>
                            <span class="fs-4 fw-bold">建筑修缮审批系统</span>
                        </div>
                    </a>
                </div>
                <div class="flex-grow-1 text-end">
                    <ul class="navbar-nav d-flex align-items-center justify-content-end">
                        <li class="nav-item me-3">
                            <span class="nav-link">欢迎，{{ current_user.username }} ({{ current_user.role }})</span>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-secondary" href="{{ url_for('logout') }}">
                                <i class="fas fa-sign-out-alt me-1"></i> 退出登录
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-CN', options);
        });
    </script>
    
    <div class="wrapper">
        <aside class="sidebar">
            <ul>
                <li>
                    <a href="{{ url_for('dashboard') }}">
                        <i class="fas fa-home"></i>
                        <span>仪表盘</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('create_project') }}" class="active">
                        <i class="fas fa-plus"></i>
                        <span>创建项目</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('user_history') }}">
                        <i class="fas fa-history"></i>
                        <span>历史记录</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('user_settings') }}">
                        <i class="fas fa-user-cog"></i>
                        <span>个人设置</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('help_center') }}">
                        <i class="fas fa-question-circle"></i>
                        <span>帮助中心</span>
                    </a>
                </li>
            </ul>
        </aside>
        
        <main class="main-content">
            <div class="form-container fade-in">
                <h2 class="mb-4">创建修缮项目</h2>
                <form method="POST" action="{{ url_for('create_project') }}" class="project-form">
                    <div class="mb-4">
                        <label for="name" class="form-label">项目名称</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-4">
                        <label for="location" class="form-label">位置</label>
                        <input type="text" class="form-control" id="location" name="location" required>
                    </div>
                    <div class="mb-4">
                        <label for="budget" class="form-label">预算</label>
                        <input type="number" class="form-control" id="budget" name="budget" step="0.01" min="0" required>
                    </div>
                    <div class="mb-4">
                        <label for="content" class="form-label">修缮内容</label>
                        <textarea class="form-control" id="content" name="content" rows="5" required></textarea>
                    </div>
                    <div class="d-flex gap-3">
                        <button type="submit" class="btn btn-primary flex-grow-1">
                            <i class="fas fa-paper-plane me-2"></i> 提交申请
                        </button>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
                            <i class="fas fa-times me-2"></i> 取消
                        </a>
                    </div>
                </form>
            </div>
        </main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
